<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Form Fill — Input Demo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap"
      rel="stylesheet" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet" />
    <style>
      body {
        font-family: "Manrope", sans-serif;
        background: #f0f2f5;
      }

      /* ── Accordion / Section card ── */
      .accordion-item {
        border: 1px solid #e4e7eb;
        border-radius: 12px !important;
        overflow: hidden;
      }

      /* Accordion header row — holds button + actions side-by-side */
      .accordion-header {
        display: flex;
        align-items: stretch;
        background: #c8ede6;
      }

      .accordion-button.section-btn {
        flex: 1;
        background: #c8ede6;
        color: #1a3c34;
        font-size: 0.92rem;
        font-weight: 700;
        padding: 13px 18px;
        box-shadow: none !important;
      }
      .accordion-button.section-btn:not(.collapsed) {
        background: #c8ede6;
        color: #1a3c34;
      }
      .accordion-button.section-btn::after {
        filter: brightness(0) saturate(100%) invert(18%) sepia(29%) saturate(548%) hue-rotate(117deg) brightness(94%) contrast(94%);
      }
      .accordion-button.section-btn:focus { box-shadow: none !important; }

      .section-header-actions {
        display: flex;
        align-items: center;
        padding: 0 14px 0 4px;
      }

      /* Form Fill trigger button */
      .btn-form-fill {
        font-size: 0.7rem;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        padding: 3px 10px;
        border-radius: 6px;
        background: #129fb5;
        color: #fff;
        border: none;
        line-height: 1.6;
        transition:
          background 0.15s,
          transform 0.1s;
      }
      .btn-form-fill:hover {
        background: #0e8fa3;
      }
      .btn-form-fill:active {
        transform: scale(0.97);
      }

      /* ── Input list ── */
      .section-body {
        padding: 16px 18px 20px;
      }

      .form-fill-input {
        width: 100%;
        border: 1.5px solid #e2e8f0;
        border-radius: 999px;
        padding: 9px 16px;
        font-size: 0.82rem;
        font-family: "Manrope", sans-serif;
        color: #1a1a1b;
        outline: none;
        transition:
          border-color 0.15s,
          box-shadow 0.15s;
        background: #fff;
      }
      .form-fill-input::placeholder {
        color: #9ca3af;
      }
      .form-fill-input:focus {
        border-color: #129fb5;
        box-shadow: 0 0 0 3px rgba(18, 159, 181, 0.12);
      }

      .input-row {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 10px;
      }
      .input-row:last-child {
        margin-bottom: 0;
      }

      .input-index {
        font-size: 0.65rem;
        font-weight: 600;
        color: #cbd5e1;
        width: 16px;
        text-align: right;
        flex-shrink: 0;
      }

      /* ── Modal ── */
      .modal-header {
        background: #c8ede6;
        border-bottom: 1px solid #a8d9cf;
      }
      .modal-title {
        font-size: 0.9rem;
        font-weight: 700;
        color: #1a3c34;
      }

      .ff-subtitle {
        font-size: 0.75rem;
        color: #6b7280;
        margin-bottom: 10px;
        line-height: 1.5;
      }

      .ff-textarea {
        font-family: "Manrope", monospace;
        font-size: 0.82rem;
        border-radius: 8px;
        border: 1.5px solid #e2e8f0;
        resize: vertical;
        min-height: 280px;
        line-height: 1.9;
        padding: 10px 14px;
        transition:
          border-color 0.15s,
          box-shadow 0.15s;
      }
      .ff-textarea:focus {
        border-color: #129fb5;
        box-shadow: 0 0 0 3px rgba(18, 159, 181, 0.12);
        outline: none;
      }
      .ff-textarea.is-invalid {
        border-color: #dc3545;
        box-shadow: 0 0 0 3px rgba(220, 53, 69, 0.1);
      }

      .ff-counter {
        font-size: 0.68rem;
        font-weight: 600;
        letter-spacing: 0.03em;
      }

      .ff-error {
        font-size: 0.75rem;
        border-radius: 7px;
      }

      .btn-confirm {
        background: #129fb5;
        border: none;
        color: #fff;
        font-size: 0.78rem;
        font-weight: 700;
        letter-spacing: 0.04em;
        padding: 7px 20px;
        border-radius: 7px;
        transition: background 0.15s;
      }
      .btn-confirm:hover {
        background: #0e8fa3;
        color: #fff;
      }
      .btn-confirm:active {
        background: #0c7f91;
      }
    </style>
  </head>
  <body class="py-5">
    <div
      data-controller="form-fill"
      data-form-fill-group-class-value="form-fill-headlines">

    <div class="container" style="max-width: 680px">
      <!-- ── HEADLINES SECTION ── -->
      <div class="accordion" id="headlinesAccordion">
        <div class="accordion-item">

          <!-- Header -->
          <div class="accordion-header">
            <button
              class="accordion-button section-btn"
              type="button"
              data-bs-toggle="collapse"
              data-bs-target="#headlinesBody"
              aria-expanded="true"
              aria-controls="headlinesBody">
              Headlines
            </button>
            <div class="section-header-actions">
              <button
                class="btn-form-fill"
                type="button"
                data-action="click->form-fill#open">
                ⚡ Form Fill
              </button>
            </div>
          </div>

          <!-- Body -->
          <div
            id="headlinesBody"
            class="accordion-collapse collapse show"
            data-bs-parent="#headlinesAccordion">
          <div class="section-body">
            <div class="input-row">
              <span class="input-index">1</span>
              <input
                type="text"
                class="form-fill-input form-fill-headlines"
                placeholder="Headline 1"
                maxlength="50"
                value="I test the 1st headline of my" />
            </div>
            <div class="input-row">
              <span class="input-index">2</span>
              <input
                type="text"
                class="form-fill-input form-fill-headlines"
                placeholder="Headline 2"
                maxlength="30"
                value="I test the 2nd headline of my" />
            </div>
            <div class="input-row">
              <span class="input-index">3</span>
              <input
                type="text"
                class="form-fill-input form-fill-headlines"
                placeholder="Headline 3"
                maxlength="30" />
            </div>
            <div class="input-row">
              <span class="input-index">4</span>
              <input
                type="text"
                class="form-fill-input form-fill-headlines"
                placeholder="Headline 4"
                maxlength="30" />
            </div>
            <div class="input-row">
              <span class="input-index">5</span>
              <input
                type="text"
                class="form-fill-input form-fill-headlines"
                placeholder="Headline 5"
                maxlength="30" />
            </div>
            <div class="input-row">
              <span class="input-index">6</span>
              <input
                type="text"
                class="form-fill-input form-fill-headlines"
                placeholder="Headline 6"
                maxlength="30" />
            </div>
            <div class="input-row">
              <span class="input-index">7</span>
              <input
                type="text"
                class="form-fill-input form-fill-headlines"
                placeholder="Headline 7"
                maxlength="30" />
            </div>
            <div class="input-row">
              <span class="input-index">8</span>
              <input
                type="text"
                class="form-fill-input form-fill-headlines"
                placeholder="Headline 8"
                maxlength="30" />
            </div>
            <div class="input-row">
              <span class="input-index">9</span>
              <input
                type="text"
                class="form-fill-input form-fill-headlines"
                placeholder="Headline 9"
                maxlength="30" />
            </div>
            <div class="input-row">
              <span class="input-index">10</span>
              <input
                type="text"
                class="form-fill-input form-fill-headlines"
                placeholder="Headline 10"
                maxlength="30" />
            </div>
            <div class="input-row">
              <span class="input-index">11</span>
              <input
                type="text"
                class="form-fill-input form-fill-headlines"
                placeholder="Headline 11"
                maxlength="30" />
            </div>
            <div class="input-row">
              <span class="input-index">12</span>
              <input
                type="text"
                class="form-fill-input form-fill-headlines"
                placeholder="Headline 12"
                maxlength="30" />
            </div>
            <div class="input-row">
              <span class="input-index">13</span>
              <input
                type="text"
                class="form-fill-input form-fill-headlines"
                placeholder="Headline 13"
                maxlength="30" />
            </div>
            <div class="input-row">
              <span class="input-index">14</span>
              <input
                type="text"
                class="form-fill-input form-fill-headlines"
                placeholder="Headline 14"
                maxlength="30" />
            </div>
            <div class="input-row">
              <span class="input-index">15</span>
              <input
                type="text"
                class="form-fill-input form-fill-headlines"
                placeholder="Headline 15"
                maxlength="30" />
            </div>
          </div>
          </div><!-- /accordion-collapse -->
        </div><!-- /accordion-item -->
      </div><!-- /accordion -->
      <!-- /HEADLINES SECTION -->
    </div><!-- /container -->

    <!-- ── FORM FILL MODAL ── -->
    <div
      class="modal fade"
      data-form-fill-target="modal"
      tabindex="-1"
      aria-labelledby="formFillModalLabel"
      aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow">
          <div class="modal-header">
            <h5 class="modal-title" id="formFillModalLabel">
              ⚡ Form Fill — Headlines
            </h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"></button>
          </div>

          <div class="modal-body pb-2">
            <p class="ff-subtitle">
              Paste or type one value per line. Each line fills the
              corresponding input in order. Max <strong>15 lines</strong> · max
              <strong>30 characters</strong> per line.
            </p>

            <!-- Error alert -->
            <div
              class="alert alert-danger py-2 ff-error d-none"
              data-form-fill-target="error"
              role="alert"></div>

            <!-- Textarea -->
            <textarea
              class="form-control ff-textarea"
              data-form-fill-target="textarea"
              data-action="input->form-fill#updateCounter"
              placeholder="Line 1 → Headline 1&#10;Line 2 → Headline 2&#10;…"
              spellcheck="false"></textarea>

            <!-- Counter -->
            <div class="d-flex justify-content-end mt-1">
              <span class="ff-counter text-muted" data-form-fill-target="counter"
                >0 / 15 lines</span
              >
            </div>
          </div>

          <div class="modal-footer border-0 pt-0">
            <button
              type="button"
              class="btn btn-light btn-sm px-4"
              data-bs-dismiss="modal">
              Cancel
            </button>
            <button
              type="button"
              class="btn-confirm"
              data-action="click->form-fill#confirm">
              Confirm & Fill
            </button>
          </div>
        </div>
      </div>
    </div><!-- /data-controller -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script type="importmap">
      { "imports": { "@hotwired/stimulus": "https://cdn.jsdelivr.net/npm/@hotwired/stimulus@3.2.2/dist/stimulus.js" } }
    </script>

    <script type="module">
      import { Application }      from "@hotwired/stimulus"
      import FormFillController   from "/js/form-fill-controller.js"

      const app = Application.start()
      app.register("form-fill", FormFillController)
    </script>
  </body>
</html>
