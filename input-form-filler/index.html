<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Form Fill — Input Demo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap"
      rel="stylesheet" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet" />
    <style>
      body {
        font-family: "Manrope", sans-serif;
        background: #f0f2f5;
      }

      /* ── Section card ── */
      .section-card {
        background: #fff;
        border-radius: 12px;
        overflow: hidden;
        border: 1px solid #e4e7eb;
      }

      /* ── Section header (mint/teal) ── */
      .section-header {
        background: #c8ede6;
        padding: 13px 18px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        cursor: pointer;
        user-select: none;
      }
      .section-header .section-title {
        font-size: 0.92rem;
        font-weight: 700;
        color: #1a3c34;
        margin: 0;
      }
      .section-header-right {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      /* Form Fill trigger button */
      .btn-form-fill {
        font-size: 0.7rem;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        padding: 3px 10px;
        border-radius: 6px;
        background: #129fb5;
        color: #fff;
        border: none;
        line-height: 1.6;
        transition:
          background 0.15s,
          transform 0.1s;
      }
      .btn-form-fill:hover {
        background: #0e8fa3;
      }
      .btn-form-fill:active {
        transform: scale(0.97);
      }

      /* Collapse chevron */
      .chevron {
        font-size: 0.8rem;
        color: #1a3c34;
        line-height: 1;
        transition: transform 0.2s;
      }
      .chevron.collapsed {
        transform: rotate(180deg);
      }

      /* ── Input list ── */
      .section-body {
        padding: 16px 18px 20px;
      }

      .form-fill-input {
        width: 100%;
        border: 1.5px solid #e2e8f0;
        border-radius: 999px;
        padding: 9px 16px;
        font-size: 0.82rem;
        font-family: "Manrope", sans-serif;
        color: #1a1a1b;
        outline: none;
        transition:
          border-color 0.15s,
          box-shadow 0.15s;
        background: #fff;
      }
      .form-fill-input::placeholder {
        color: #9ca3af;
      }
      .form-fill-input:focus {
        border-color: #129fb5;
        box-shadow: 0 0 0 3px rgba(18, 159, 181, 0.12);
      }

      .input-row {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 10px;
      }
      .input-row:last-child {
        margin-bottom: 0;
      }

      .input-index {
        font-size: 0.65rem;
        font-weight: 600;
        color: #cbd5e1;
        width: 16px;
        text-align: right;
        flex-shrink: 0;
      }

      /* ── Modal ── */
      .modal-header {
        background: #c8ede6;
        border-bottom: 1px solid #a8d9cf;
      }
      .modal-title {
        font-size: 0.9rem;
        font-weight: 700;
        color: #1a3c34;
      }

      .ff-subtitle {
        font-size: 0.75rem;
        color: #6b7280;
        margin-bottom: 10px;
        line-height: 1.5;
      }

      .ff-textarea {
        font-family: "Manrope", monospace;
        font-size: 0.82rem;
        border-radius: 8px;
        border: 1.5px solid #e2e8f0;
        resize: vertical;
        min-height: 280px;
        line-height: 1.9;
        padding: 10px 14px;
        transition:
          border-color 0.15s,
          box-shadow 0.15s;
      }
      .ff-textarea:focus {
        border-color: #129fb5;
        box-shadow: 0 0 0 3px rgba(18, 159, 181, 0.12);
        outline: none;
      }
      .ff-textarea.is-invalid {
        border-color: #dc3545;
        box-shadow: 0 0 0 3px rgba(220, 53, 69, 0.1);
      }

      .ff-counter {
        font-size: 0.68rem;
        font-weight: 600;
        letter-spacing: 0.03em;
      }

      .ff-error {
        font-size: 0.75rem;
        border-radius: 7px;
      }

      .btn-confirm {
        background: #129fb5;
        border: none;
        color: #fff;
        font-size: 0.78rem;
        font-weight: 700;
        letter-spacing: 0.04em;
        padding: 7px 20px;
        border-radius: 7px;
        transition: background 0.15s;
      }
      .btn-confirm:hover {
        background: #0e8fa3;
        color: #fff;
      }
      .btn-confirm:active {
        background: #0c7f91;
      }
    </style>
  </head>
  <body class="py-5">
    <div class="container" style="max-width: 680px">
      <!-- ── HEADLINES SECTION ── -->
      <div class="section-card">
        <!-- Header -->
        <div
          class="section-header"
          data-bs-target="#headlinesBody"
          aria-expanded="true">
          <h2 class="section-title">Headlines</h2>
          <div class="section-header-right">
            <!-- Form Fill button — stop propagation so it doesn't toggle collapse -->
            <button
              class="btn-form-fill"
              id="openFormFill"
              onclick="event.stopPropagation()">
              ⚡ Form Fill
            </button>
            <span class="chevron" id="headlinesChevron">∧</span>
          </div>
        </div>

        <!-- Body -->
        <div class="collapse show" id="headlinesBody">
          <div class="section-body">
            <div class="input-row">
              <span class="input-index">1</span>
              <input
                type="text"
                class="form-fill-input form-fill-headlines"
                placeholder="Headline 1"
                maxlength="50"
                value="I test the 1st headline of my" />
            </div>
            <div class="input-row">
              <span class="input-index">2</span>
              <input
                type="text"
                class="form-fill-input form-fill-headlines"
                placeholder="Headline 2"
                maxlength="30"
                value="I test the 2nd headline of my" />
            </div>
            <div class="input-row">
              <span class="input-index">3</span>
              <input
                type="text"
                class="form-fill-input form-fill-headlines"
                placeholder="Headline 3"
                maxlength="30" />
            </div>
            <div class="input-row">
              <span class="input-index">4</span>
              <input
                type="text"
                class="form-fill-input form-fill-headlines"
                placeholder="Headline 4"
                maxlength="30" />
            </div>
            <div class="input-row">
              <span class="input-index">5</span>
              <input
                type="text"
                class="form-fill-input form-fill-headlines"
                placeholder="Headline 5"
                maxlength="30" />
            </div>
            <div class="input-row">
              <span class="input-index">6</span>
              <input
                type="text"
                class="form-fill-input form-fill-headlines"
                placeholder="Headline 6"
                maxlength="30" />
            </div>
            <div class="input-row">
              <span class="input-index">7</span>
              <input
                type="text"
                class="form-fill-input form-fill-headlines"
                placeholder="Headline 7"
                maxlength="30" />
            </div>
            <div class="input-row">
              <span class="input-index">8</span>
              <input
                type="text"
                class="form-fill-input form-fill-headlines"
                placeholder="Headline 8"
                maxlength="30" />
            </div>
            <div class="input-row">
              <span class="input-index">9</span>
              <input
                type="text"
                class="form-fill-input form-fill-headlines"
                placeholder="Headline 9"
                maxlength="30" />
            </div>
            <div class="input-row">
              <span class="input-index">10</span>
              <input
                type="text"
                class="form-fill-input form-fill-headlines"
                placeholder="Headline 10"
                maxlength="30" />
            </div>
            <div class="input-row">
              <span class="input-index">11</span>
              <input
                type="text"
                class="form-fill-input form-fill-headlines"
                placeholder="Headline 11"
                maxlength="30" />
            </div>
            <div class="input-row">
              <span class="input-index">12</span>
              <input
                type="text"
                class="form-fill-input form-fill-headlines"
                placeholder="Headline 12"
                maxlength="30" />
            </div>
            <div class="input-row">
              <span class="input-index">13</span>
              <input
                type="text"
                class="form-fill-input form-fill-headlines"
                placeholder="Headline 13"
                maxlength="30" />
            </div>
            <div class="input-row">
              <span class="input-index">14</span>
              <input
                type="text"
                class="form-fill-input form-fill-headlines"
                placeholder="Headline 14"
                maxlength="30" />
            </div>
            <div class="input-row">
              <span class="input-index">15</span>
              <input
                type="text"
                class="form-fill-input form-fill-headlines"
                placeholder="Headline 15"
                maxlength="30" />
            </div>
          </div>
        </div>
      </div>
      <!-- /HEADLINES SECTION -->
    </div>

    <!-- ══════════════════════════════════════
       FORM FILL MODAL
  ══════════════════════════════════════ -->
    <div
      class="modal fade"
      id="formFillModal"
      tabindex="-1"
      aria-labelledby="formFillModalLabel"
      aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow">
          <div class="modal-header">
            <h5 class="modal-title" id="formFillModalLabel">
              ⚡ Form Fill — Headlines
            </h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"></button>
          </div>

          <div class="modal-body pb-2">
            <p class="ff-subtitle">
              Paste or type one value per line. Each line fills the
              corresponding input in order. Max <strong>15 lines</strong> · max
              <strong>30 characters</strong> per line.
            </p>

            <!-- Error alert -->
            <div
              class="alert alert-danger py-2 ff-error d-none"
              data-ff-error
              role="alert"></div>

            <!-- Textarea -->
            <textarea
              class="form-control ff-textarea"
              data-ff-textarea
              placeholder="Line 1 → Headline 1&#10;Line 2 → Headline 2&#10;…"
              spellcheck="false"></textarea>

            <!-- Counter -->
            <div class="d-flex justify-content-end mt-1">
              <span class="ff-counter text-muted" data-ff-counter
                >0 / 15 lines</span
              >
            </div>
          </div>

          <div class="modal-footer border-0 pt-0">
            <button
              type="button"
              class="btn btn-light btn-sm px-4"
              data-bs-dismiss="modal">
              Cancel
            </button>
            <button type="button" class="btn-confirm" data-ff-confirm>
              Confirm & Fill
            </button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module">
      import { FormFill } from "./form-fill.js";

      // Sync chevron with collapse state
      const collapseEl = document.getElementById("headlinesBody");
      const chevron = document.getElementById("headlinesChevron");
      collapseEl.addEventListener("hide.bs.collapse", () =>
        chevron.classList.add("collapsed"),
      );
      collapseEl.addEventListener("show.bs.collapse", () =>
        chevron.classList.remove("collapsed"),
      );

      // Init FormFill for the headlines group
      const ff = new FormFill({
        groupClass: "form-fill-headlines",
        modalId: "formFillModal",
      }).init();

      document
        .getElementById("openFormFill")
        .addEventListener("click", () => ff.open());
    </script>
  </body>
</html>
